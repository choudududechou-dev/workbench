<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>工作台</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(-45deg, #1a1a2e, #16213e, #0f0f23, #1a1a2e);
    background-size: 400% 400%;
    animation: bgFlow 12s ease infinite;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 40px 28px;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  @keyframes bgFlow {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .container {
    width: 100%;
    max-width: 520px;
  }

  /* 头部 */
  .header {
    text-align: center;
    margin-bottom: 48px;
  }

  .header .icon {
    font-size: 56px;
    margin-bottom: 12px;
  }

  .header h1 {
    font-size: 36px;
    font-weight: 700;
    color: #5B8CBF;
    letter-spacing: 2px;
  }

  /* 卡片区 */
  .cards {
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  .card {
    position: relative;
    display: flex;
    align-items: center;
    background: #fff;
    border-radius: 24px;
    padding: 28px 32px;
    cursor: pointer;
    text-decoration: none;
    overflow: hidden;
    transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1),
                box-shadow 0.35s ease;
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.25),
                0 1px 4px rgba(0, 0, 0, 0.15);
  }

  /* 卡片底部流动光泽条 */
  .card::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 3px;
    border-radius: 0 0 24px 24px;
    background: linear-gradient(90deg, #7B6796, #cf59e6, #6bc5f8, #7B6796);
    background-size: 300% 100%;
    animation: shimmer 4s ease infinite;
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  .card:hover::after,
  .card:active::after {
    opacity: 1;
  }

  @keyframes shimmer {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* 按压效果 */
  .card:active {
    transform: scale(0.96);
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18);
  }

  /* 图标容器 */
  .card-icon {
    width: 76px;
    height: 76px;
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 38px;
    flex-shrink: 0;
    margin-right: 24px;
    position: relative;
    background-size: 200% 200%;
    animation: iconShine 5s ease infinite;
    transition: transform 0.3s ease;
  }

  .card:active .card-icon {
    transform: scale(0.9);
  }

  .card-icon.attendance {
    background: linear-gradient(135deg, #7B6796, #9B87B6, #7B6796);
    background-size: 200% 200%;
  }

  .card-icon.expense {
    background: linear-gradient(135deg, #E8913A, #F0A85A, #E8913A);
    background-size: 200% 200%;
  }

  .card-icon.project {
    background: linear-gradient(135deg, #5B8CBF, #7AABDB, #5B8CBF);
    background-size: 200% 200%;
  }

  @keyframes iconShine {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* 文字区 */
  .card-body {
    flex: 1;
    min-width: 0;
  }

  .card-body .title {
    font-size: 28px;
    font-weight: 700;
    color: #2d2240;
    margin-bottom: 6px;
    transition: color 0.3s ease;
  }

  .card-body .desc {
    font-size: 16px;
    color: #9b8faa;
    line-height: 1.5;
    transition: color 0.3s ease;
  }

  /* 入场动画 - 卡片依次出现 */
  .card:nth-child(1) { animation: fadeInUp 0.5s ease both; animation-delay: 0.1s; }
  .card:nth-child(2) { animation: fadeInUp 0.5s ease both; animation-delay: 0.2s; }
  .card:nth-child(3) { animation: fadeInUp 0.5s ease both; animation-delay: 0.3s; }

  @keyframes fadeInUp {
    from {
      opacity: 0;
      transform: translateY(30px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  /* 头部入场 */
  .header {
    animation: fadeInUp 0.6s ease both;
  }
</style>
</head>
<body>

<div class="container">

  <div class="header">
    <div class="icon">🖥️</div>
    <h1>工作台</h1>
  </div>

  <div class="cards">

    <a class="card" href="https://www.kdocs.cn/wo/sl/v14NSMM">
      <div class="card-icon attendance">📍</div>
      <div class="card-body">
        <div class="title">考勤打卡</div>
        <div class="desc">上班签到 · 下班签退</div>
      </div>
    </a>

    <a class="card" href="https://www.kdocs.cn/wo/sl/v12LSIfo">
      <div class="card-icon expense">💰</div>
      <div class="card-body">
        <div class="title">费用报销</div>
        <div class="desc">填物料规格 · 数量单价</div>
      </div>
    </a>

    <a class="card" href="https://www.kdocs.cn/wo/sl/v13XXN5i">
      <div class="card-icon project">📋</div>
      <div class="card-body">
        <div class="title">立项申请</div>
        <div class="desc">新增项目 · 填客户信息</div>
      </div>
    </a>

  </div>

</div>

</body>
</html>
