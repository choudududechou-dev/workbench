<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>工作台</title>
<style>
  html {
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(-45deg, #1a1a2e, #16213e, #0f0f23, #1a1a2e);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 40px 28px;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  .container {
    width: 100%;
    max-width: 520px;
  }

  /* 头部 */
  .header {
    text-align: center;
    margin-bottom: 48px;
  }

  .header .icon {
    font-size: 56px;
    margin-bottom: 12px;
  }

  .header h1 {
    font-size: 36px;
    font-weight: 700;
    color: #5B8CBF;
    letter-spacing: 2px;
  }

  /* 卡片区 */
  .cards {
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  .card {
    display: flex;
    align-items: center;
    background: #fff;
    border-radius: 24px;
    padding: 28px 32px;
    cursor: pointer;
    text-decoration: none;
    transition: transform 0.15s ease;
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.25),
                0 1px 4px rgba(0, 0, 0, 0.15);
  }

  /* 按压效果 */
  .card:active {
    transform: scale(0.96);
  }

  /* 图标容器 */
  .card-icon {
    width: 76px;
    height: 76px;
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 38px;
    flex-shrink: 0;
    margin-right: 24px;
  }

  .card-icon.attendance {
    background: linear-gradient(135deg, #7B6796, #9B87B6);
  }

  .card-icon.expense {
    background: linear-gradient(135deg, #E8913A, #F0A85A);
  }

  .card-icon.project {
    background: linear-gradient(135deg, #5B8CBF, #7AABDB);
  }

  /* 文字区 */
  .card-body {
    flex: 1;
    min-width: 0;
  }

  .card-body .title {
    font-size: 28px;
    font-weight: 700;
    color: #2d2240;
    margin-bottom: 6px;
  }

  .card-body .desc {
    font-size: 16px;
    color: #9b8faa;
    line-height: 1.5;
  }
</style>
</head>
<body>

<div class="container">

  <div class="header">
    <div class="icon">🖥️</div>
    <h1>工作台</h1>
  </div>

  <div class="cards">

    <a class="card" href="https://www.kdocs.cn/wo/sl/v14NSMM">
      <div class="card-icon attendance">📍</div>
      <div class="card-body">
        <div class="title">考勤打卡</div>
        <div class="desc">上班签到 · 下班签退</div>
      </div>
    </a>

    <a class="card" href="https://www.kdocs.cn/wo/sl/v12LSIfo">
      <div class="card-icon expense">💰</div>
      <div class="card-body">
        <div class="title">费用报销</div>
        <div class="desc">填物料规格 · 数量单价</div>
      </div>
    </a>

    <a class="card" href="https://www.kdocs.cn/wo/sl/v13XXN5i">
      <div class="card-icon project">📋</div>
      <div class="card-body">
        <div class="title">立项申请</div>
        <div class="desc">新增项目 · 填客户信息</div>
      </div>
    </a>

  </div>

</div>

</body>
</html>
